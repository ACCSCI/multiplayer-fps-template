name: Build and deploy to VibeHub

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vibehub-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build & test
        run: |
          bun install
          # --parallel=<文件数>:每个测试文件独立 worker,避免同 worker 内
          # 顺序执行时跨文件共享模块状态(settings 常量)导致的偶发失败
          bun test --parallel=25
          bunx biome check .
          bun run scripts/check-lines.ts

      - name: Install verified VibeHub CLI
        if: github.event_name == 'push'
        run: |
          installer="$(mktemp)"
          curl -fsSL --retry 3 https://vibe.lumigrav.space/downloads/vibehub-cli/install.sh -o "$installer"
          sh "$installer"
          rm -f "$installer"

      - name: Create concise release note
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pull_request="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[0] | select(.) | "PR #\(.number) · \(.head.ref) · \(.title)"' \
              2>/dev/null || true
          )"
          if [ -n "$pull_request" ]; then
            release_note="$pull_request"
          else
            commit_title="$(git log -1 --pretty=%s)"
            release_note="直接推送 · ${commit_title:0:1000}"
          fi
          printf '%s\n' "$release_note" > "$RUNNER_TEMP/vibehub-release-note.txt"

      - name: Publish built files
        if: github.event_name == 'push'
        env:
          VIBEHUB_TOKEN: ${{ secrets.VIBEHUB_PROJECT_TOKEN }}
        run: |
          "$HOME/.local/bin/vibehub" update \
            --slug counter-strike-football \
            --dir www \
            --note-file "$RUNNER_TEMP/vibehub-release-note.txt"
