name: "Tests"
on:
  push:
    branches: ['*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Install dependencies"
        run: bun install

      - name: "Run tests"
        run: bun test

      - name: "Lint (biome)"
        run: bunx biome check .

      - name: "Check line limits"
        run: bun run scripts/check-lines.ts
